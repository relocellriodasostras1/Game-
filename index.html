<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Infernal Pixel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#2a0000;
  overflow:hidden;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  height:100vh;
}

canvas{
  background:radial-gradient(circle,#cc4400,#440000);
  border-radius:10px;
  margin-top:-20px;
}

/* LOBBY */
#lobby{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,#ff3300,#550000);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#lobby h1{
  color:#fff;
  font-size:36px;
  text-shadow:0 0 15px red;
}

#lobby button{
  font-size:22px;
  padding:14px 40px;
  border:none;
  border-radius:10px;
  background:#ff2200;
  color:#fff;
}

/* ANALÓGICO */
#joystick{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,0.15);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:50px;
  height:50px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,#ffcc00,#ff3300,#660000);
  box-shadow:0 0 25px orange,0 0 45px red;
}

/* BOTÕES */
button.gameBtn{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  padding:14px 30px;
  font-size:20px;
  border:none;
  border-radius:10px;
  display:none;
}

#restart{ top:60%; background:#00ff88; }
#backLobby{ top:50%; background:#ff2200; color:white; }
</style>
</head>

<body>

<!-- LOBBY -->
<div id="lobby">
  <h1>Infernal Pixel</h1>
  <button id="startBtn">INICIAR</button>
</div>

<canvas id="game" width="360" height="520"></canvas>

<div id="joystick"><div id="stick"></div></div>

<button id="backLobby" class="gameBtn">Voltar para o Lobby</button>
<button id="restart" class="gameBtn">Reiniciar</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

/* 🔊 MÚSICA LOCAL (OBRIGATÓRIO TER musica.mp3 NA PASTA) */
const musica = new Audio("musica.mp3");
musica.loop = true;
musica.volume = 0.8;

const somPerdeu = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

let player,enemies,score,over;
let fire=[];
let musicStarted=false;

function resetar(){
  player={x:160,y:380,w:38,h:38,dx:0,dy:0,speed:8};
  enemies=[];
  score=0;
  over=false;
  fire=[];
  document.querySelectorAll(".gameBtn").forEach(b=>b.style.display="none");
  loop();
}

/* ANALÓGICO */
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let ativo=false;
const limite=50;

joystick.addEventListener("touchstart",()=>{
  ativo=true;
});

joystick.addEventListener("touchend",()=>{
  ativo=false;
  stick.style.transform="translate(-50%,-50%)";
  player.dx=0; player.dy=0;
});

joystick.addEventListener("touchmove",e=>{
  if(!ativo)return;
  const t=e.touches[0];
  const r=joystick.getBoundingClientRect();
  let x=t.clientX-(r.left+r.width/2);
  let y=t.clientY-(r.top+r.height/2);
  const d=Math.hypot(x,y);
  if(d>limite){x=x/d*limite;y=y/d*limite;}
  stick.style.transform=`translate(${x}px,${y}px)`;
  player.dx=x/limite*player.speed;
  player.dy=y/limite*player.speed;

  fire.push({x:canvas.width/2+x,y:canvas.height-70+y,life:15});
});

/* INIMIGOS */
setInterval(()=>{
  if(!over){
    enemies.push({x:Math.random()*(canvas.width-38),y:-40,w:38,h:38,s:5+score/120});
  }
},900);

function colisao(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

/* LOOP */
function loop(){
  if(over)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="rgba(255,80,0,0.15)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  fire.forEach((p,i)=>{
    ctx.fillStyle="rgba(255,140,0,0.6)";
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
    p.y-=1.5;
    if(--p.life<=0)fire.splice(i,1);
  });

  player.x+=player.dx;
  player.y+=player.dy;
  player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));

  ctx.fillStyle="lime";
  ctx.fillRect(player.x,player.y,player.w,player.h);

  ctx.fillStyle="#ff0000";
  enemies.forEach(e=>{
    e.y+=e.s;
    ctx.fillRect(e.x,e.y,e.w,e.h);
    if(colisao(player,e)){
      over=true;
      somPerdeu.play();
      musica.pause();
      musicStarted=false;
      document.getElementById("restart").style.display="block";
      document.getElementById("backLobby").style.display="block";
    }
  });

  enemies=enemies.filter(e=>e.y<canvas.height+50);

  score++;
  ctx.fillStyle="white";
  ctx.fillText("Pontos: "+score,10,20);

  requestAnimationFrame(loop);
}

/* BOTÕES */
document.getElementById("startBtn").addEventListener("click",()=>{
  if(!musicStarted){
    musica.currentTime=0;
    musica.play().catch(()=>{});
    musicStarted=true;
  }
  document.getElementById("lobby").style.display="none";
  resetar();
});

document.getElementById("restart").onclick=resetar;

document.getElementById("backLobby").onclick=()=>{
  document.getElementById("lobby").style.display="flex";
  resetar();
};
</script>

</body>
</html>>
